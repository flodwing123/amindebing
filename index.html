<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌿 啊敏的兵 · 班主任工作台</title>
<meta name="description" content="啊敏的兵——初中道德与法治老师兼班主任的专属工作台：早日退休、班级管理、作业提效、每周班会AI备课、家校沟通、荣誉手账。">
<meta name="theme-color" content="#1B4332">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 左侧功能栏 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🌿</span>
        <div class="logo-text">
          <h1>啊敏的兵</h1>
          <p>道德与法治 · 班主任</p>
        </div>
      </div>
      <button class="icon-btn" id="btnAddTask" title="新增任务">＋</button>
    </div>

    <!-- 今日任务进度 -->
    <div class="daily-progress">
      <div class="dp-head">
        <span>📌 今日任务</span>
        <span id="dpCount">0/0</span>
      </div>
      <div class="dp-bar"><div class="dp-bar-inner" id="dpBar"></div></div>
    </div>

    <!-- 任务导航列表 -->
    <nav id="taskNav">
      <!-- 由 JS 动态渲染 -->
    </nav>

    <div class="sidebar-footer">
      <div id="todayDate" class="today-date"></div>
      <button class="ghost-btn" id="btnExport" title="导出全部数据备份（手机/电脑互传）">💾 备份</button>
      <button class="ghost-btn" id="btnImport" title="从备份文件恢复数据（手机/电脑互传）">📥 恢复</button>
      <input type="file" id="inpImport" accept=".json,application/json" style="display:none">
    </div>
  </aside>

  <!-- 右侧内容区 -->
  <main id="content">
    <div id="moduleView" class="module-view">
      <!-- 模块内容由 JS 渲染 -->
    </div>
  </main>
</div>

<!-- 新增/编辑任务弹窗 -->
<div class="modal-mask" id="modalTask" style="display:none">
  <div class="modal">
    <h3 id="modalTaskTitle">新增任务</h3>
    <input type="text" id="inpTaskName" placeholder="任务名称，如：每日打卡" maxlength="20">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelTask">取消</button>
      <button class="btn btn-primary" id="btnSaveTask">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- 登录页（未登录时全屏覆盖；由 sync.js 渲染） -->
<div id="authScreen" class="auth-screen" style="display:none"></div>

<script src="js/quotes.js"></script>
<script src="js/data.js"></script>
<script src="js/modules.js"></script>
<script src="js/meeting.js"></script>
<script src="js/parentmeet.js"></script>
<script src="js/modules2.js"></script>
<script src="js/vault.js"></script>
<script src="js/ideas.js"></script>
<script src="js/study.js"></script>
<script src="js/monthly.js"></script>
<script src="js/grade-analysis.js"></script>
<script src="js/discipline.js"></script>
<script src="js/leave.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/sb-config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/sync.js"></script>
<script src="js/voice-record.js"></script>
<script src="js/app.js"></script>
<script>
// PWA 离线缓存注册（手机端安装为 App 后离线可用）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
